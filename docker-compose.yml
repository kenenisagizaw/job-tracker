services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_tracker_db}
      POSTGRES_USER: ${POSTGRES_USER:-job_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    image: busybox:1.36
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /app/storage &&
        chown -R 100:101 /app/storage &&
        chmod 0750 /app/storage
    volumes:
      - document_storage:/app/storage

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-job_tracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-job_tracker_db}
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_PATH: /app/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - document_storage:/app/storage

volumes:
  postgres_data:
  redis_data:
  document_storage:

networks:
  backend:
    internal: true
  frontend:
